[package]
name = "tsk-tui"
version = "0.10.1"
edition = "2021"
rust-version = "1.96"
description = "tsk: a task board for your terminal"
license = "MIT"
publish = false
# Root test files are modules unless explicitly registered below.
autotests = false

[[bin]]
name = "tsk"
path = "src/main.rs"

[[bin]]
name = "tsk-sync"
path = "src/bin/tsk-sync.rs"

# Shared suites link once; process-global environment/cwd tests stay isolated.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "cli_add"
path = "tests/cli_add.rs"

[[test]]
name = "cli_list"
path = "tests/cli_list.rs"

[[test]]
name = "cli_setup_agent"
path = "tests/cli_setup_agent.rs"

[[test]]
name = "queue_board_loop"
path = "tests/queue_board_loop.rs"

[[test]]
name = "starter_guides"
path = "tests/starter_guides.rs"

[[test]]
name = "update_notice"
path = "tests/update_notice.rs"

# The site generates references without compiling unrelated integration suites.
[[test]]
name = "demo_parity"
path = "tests/demo_parity.rs"

[[test]]
name = "queue_board_bench"
path = "tests/queue_board_bench.rs"

[dependencies]
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
s2-sdk = { version = "=0.34.8", default-features = false, features = ["rustls-ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.25.13"
unicode-width = "0.2"
uuid = { version = "1.24", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
# Cargo.lock pins the resolved version; a caret range here keeps another crate's newer
# libc requirement resolvable instead of failing the build.
libc = "0.2.189"
